<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Przeglądy</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="dane-startowe.js"></script>

    <!-- =====================================================
         STYLE
    ====================================================== -->
    <style>

        /* =====================================================
           KOLORY
        ====================================================== */

        :root {
            --navy: #12304a;
            --blue: #075985;
            --bg: #f1f5f9;
            --line: #cbd5e1;
            --red: #991b1b;
            --amber: #92400e;
            --green: #065f46;
        }

        /* =====================================================
           PODSTAWY
        ====================================================== */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            font: 14px system-ui, Segoe UI, Arial;
            color: #172033;
        }

        /* =====================================================
           HEADER
        ====================================================== */

        .top {
            background: var(--navy);
            color: white;
            padding: 22px max(20px, calc((100% - 1280px)/2));

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;

            border-bottom: 4px solid #38bdf8;
        }

        .top h1 {
            margin: 0;
            font-size: 26px;
        }

        .top p {
            margin: 4px 0 0;
            color: #dbeafe;
        }

        /* =====================================================
           GŁÓWNY UKŁAD
        ====================================================== */

        .wrap {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 18px;
        }

        .panel,
        .card,
        .notice {
            background: white;
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        .panel {
            padding: 16px;
            margin-bottom: 16px;
        }

        .notice {
            padding: 15px 17px;
            margin-bottom: 16px;

            background: #e0f2fe;
            color: #123e5c;

            border-left: 4px solid var(--blue);
        }

        /* =====================================================
           PRZYCISKI I FILTRY
        ====================================================== */

        .tools,
        .filters,
        .actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters {
            margin-top: 14px;
        }

        .filters input,
        .filters select {
            flex: 1;
            min-width: 155px;
        }

        button {
            border: 0;
            border-radius: 8px;

            background: var(--blue);
            color: white;

            padding: 10px 13px;

            font: inherit;
            font-weight: 700;

            cursor: pointer;
        }

        button:disabled {
            opacity: .55;
            cursor: not-allowed;
        }

        .secondary {
            background: #e2e8f0;
            color: #172033;
        }

        .danger {
            background: #fee2e2;
            color: var(--red);
        }

        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid #94a3b8;
            border-radius: 8px;
            padding: 9px;
            background: white;
            font: inherit;
        }

        /* =====================================================
           MENU UŻYTKOWNIKA
        ====================================================== */

        .user-menu {
            position: relative;
        }

        .menu-panel {
            position: absolute;
            right: 0;
            top: calc(100% + 8px);

            z-index: 10;

            min-width: 250px;

            padding: 12px;

            background: white;
            border: 1px solid var(--line);
            border-radius: 10px;

            box-shadow: 0 12px 28px #0f172a33;
        }

        .menu-panel button {
            display: block;
            width: 100%;
            margin-top: 6px;
            text-align: left;
        }

        .menu-user {
            padding: 4px 6px 10px;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
            word-break: break-word;
        }

        /* =====================================================
           STATYSTYKI
        ====================================================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 16px 0;
        }

        .stat {
            width: 100%;
            padding: 15px;

            border: 1px solid var(--line);
            border-left: 5px solid #64748b;

            background: white;

            color: #172033;
            text-align: left;
        }

        .stat:hover,
        .stat.active {
            box-shadow:
                0 0 0 3px #38bdf866,
                0 8px 18px #0f172a18;

            transform: translateY(-1px);
        }

        .stat b {
            display: block;
            font-size: 27px;
            margin-top: 4px;
        }

        .overdue {
            border-left-color: #ef4444;
        }

        .due {
            border-left-color: #f59e0b;
        }

        .ok {
            border-left-color: #10b981;
        }

        .total {
            border-left-color: #075985;
        }

        /* =====================================================
           DALSZA CZĘŚĆ CSS...
        ====================================================== */

    </style>

</head>

<body>

  <!-- =====================================================

    <section class="stats">

     MODALE

     DATALISTY

<datalist id="cities"></datalist>

<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

  /* =========================================================
   KONFIGURACJA
========================================================= */

const $ = selector => document.querySelector(selector);

const config = window.APP_CONFIG || {};

const ready = Boolean(
    config.supabaseUrl &&
    config.supabaseAnonKey
);


/* =========================================================
   LOCAL STORAGE
========================================================= */

const safeStorage = (() => {

    try {

        localStorage.setItem("__test", "1");
        localStorage.removeItem("__test");

        return localStorage;

    } catch {

        const storage = {};

        return {

            getItem: key => storage[key] || null,

            setItem: (key, value) => {
                storage[key] = String(value);
            },

            removeItem: key => {
                delete storage[key];
            }

        };
    }

})();


/* =========================================================
   SUPABASE
========================================================= */

const sb = ready
    ? window.supabase.createClient(
        config.supabaseUrl,
        config.supabaseAnonKey,
        {
            auth: {
                storage: safeStorage,
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true
            }
        }
    )
    : null;


/* =========================================================
   ZMIENNE GLOBALNE
========================================================= */

let data = [];

let inspectionTypes = [];

let locations = [];

let typeCatalogAvailable = false;

let editing = null;

let editingVersion = null;


/* =========================================================
   OGRANICZENIA PLIKÓW
========================================================= */

const MAX_PROTOCOL_SIZE = 10 * 1024 * 1024;

const ALLOWED_PROTOCOL_TYPES = new Set([

    "application/pdf",

    "image/jpeg",

    "image/png",

    "image/webp",

    "application/msword",

    "application/vnd.openxmlformats-officedocument.wordprocessingml.document",

    "application/vnd.ms-excel",

    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

]);


/* =========================================================
   DOMYŚLNE RODZAJE PRZEGLĄDÓW
========================================================= */

const fallbackTypes = [

    "Elektryczny (roczny)",
    "Elektryczny (5-cio letni)",
    "Systemy PPOŻ",
    "Gaśnice",
    "Klimatyzacja",
    "Alarmy",
    "Hydranty",
    "Rolety",
    "Wentylacja",
    "Wymiana filtrów",
    "Regałów magazynowych",
    "CRO",
    "Mroźnia/Chłodnia",
    "Regały chłodnicze",
    "Separatory tłuszczu",
    "Vendingi",
    "UDT (wózki widłowe, paleciaki)",
    "BHP (drabiny, schodki, podesty)",
    "Ansul",
    "Okap",
    "Brama garażowa",
    "Żaluzje (gastro)",
    "Bramki antykradzieżowe",
    "Klamki na kod",
    "Oświetlenie",
    "Drzwi przeciwpożarowe",
    "Drzwi na zaplecze",
    "Systemy multimedialne",
    "Posadzki, wykładziny",
    "Kontrola kurzu",
    "Light boxy",
    "Floorboxy",
    "Meble",
    "Szyby",
    "Lampy owadobójcze",
    "Samochody",
    "Windy w samochodach",
    "Mycie jednostek klimatyzacji",
    "Sprawdzenie pompy odpływowej"

];


/* =========================================================
   DOMYŚLNA LICZBA MIESIĘCY
========================================================= */

const monthsByType = {

    "elektryczny (5-cio letni)": 60,

    "elektryczny (roczny)": 12,

    "klimatyzacja": 3,

    "mycie jednostek klimatyzacji": 36,

    "wentylacja": 12,

    "rolety": 12,

    "rolety sklepowe": 12,

    "gasnice": 12,

    "oswietlenie": 1,

    "sprawdzenie pompy odplywowej": 2

};


/* =========================================================
   FUNKCJE POMOCNICZE
========================================================= */


/**
 * Zamiana znaków HTML
 */

const esc = value =>
    String(value ?? "")
        .replace(
            /[&<>"]/g,
            character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;"
            })[character]
        );


/**
 * Data ISO
 */

const iso = value =>
    value
        ? String(value).slice(0, 10)
        : "";


/**
 * Format daty
 */

const fmt = value =>
    value
        ? new Date(value + "T12:00:00")
            .toLocaleDateString("pl-PL")
        : "—";


/**
 * Usuwanie polskich znaków
 */

const norm = value =>

    String(value || "")

        .normalize("NFD")

        .replace(/[\u0300-\u036f]/g, "")

        .toLowerCase()

        .trim();

  /* =========================================================
   MAPOWANIE DANYCH Z BAZY
========================================================= */

const fromDb = row => ({

    id: row.id,

    city: row.city,

    local: row.local,

    type: row.type,

    done: iso(row.done),

    months: row.months,

    protocolDate: iso(row.protocol_date),

    protocolFileName: row.protocol_file_name,

    protocolPath: row.protocol_path,

    notes: row.notes || "",

    version: row.version,

    deletedAt: row.deleted_at

});


const toDb = row => ({

    id: row.id,

    city: row.city.trim(),

    local: row.local.trim(),

    type: row.type.trim(),

    done: row.done || null,

    months: Number(row.months),

    protocol_date: row.protocolDate || null,

    protocol_file_name: row.protocolFileName || null,

    protocol_path: row.protocolPath || null,

    notes: row.notes || ""

});



/* =========================================================
   WYLICZANIE NASTĘPNEGO TERMINU
========================================================= */

function nextDate(date, months) {

    if (!date || !months) {
        return "";
    }


    const [

        year,

        month,

        day

    ] = String(date)
        .split("-")
        .map(Number);


    const addMonths = Number(months);


    if (

        !Number.isInteger(year) ||

        !Number.isInteger(month) ||

        !Number.isInteger(day) ||

        !Number.isInteger(addMonths) ||

        addMonths < 1

    ) {

        return "";

    }


    const target =
        month - 1 + addMonths;


    const targetYear =
        year + Math.floor(target / 12);


    const targetMonth =
        ((target % 12) + 12) % 12;


    const lastDay =
        new Date(
            Date.UTC(
                targetYear,
                targetMonth + 1,
                0
            )
        )
        .getUTCDate();


    const targetDay =
        Math.min(day, lastDay);


    return (

        `${targetYear}-` +

        `${String(targetMonth + 1).padStart(2, "0")}-` +

        `${String(targetDay).padStart(2, "0")}`

    );

}



/* =========================================================
   STATUS PRZEGLĄDU
========================================================= */

function state(row) {

    const date =
        nextDate(
            row.done,
            row.months
        );


    if (!date) {
        return "";
    }


    const days =
        Math.ceil(
            (
                new Date(date + "T12:00:00") -

                new Date()

            ) / 86400000
        );


    if (days < 0) {

        return "PO TERMINIE";

    }


    if (days <= 14) {

        return "DO WYKONANIA";

    }


    return "OK";

}



/* =========================================================
   STATUS PROTOKOŁU
========================================================= */

function protocol(row) {

    return (

        row.protocolFileName ||

        row.protocolDate

    )

        ? "DODANY"

        : "BRAK PROTOKOŁU";

}



/* =========================================================
   ODMIANA LICZNIKA
========================================================= */

function countLabel(number) {


    if (number === 1) {

        return "1 przegląd";

    }


    if (

        number % 100 < 12 ||

        number % 100 > 14

    &&

        number % 10 >= 2 &&

        number % 10 <= 4

    ) {

        return `${number} przeglądy`;

    }


    return `${number} przeglądów`;

}



/* =========================================================
   ODŚWIEŻANIE LIST PODPOWIEDZI
========================================================= */

function refreshLists() {


    const selectedCity =
        $("#city").value;


    const types =
        typeCatalogAvailable
            ? inspectionTypes
            : fallbackTypes;



    const cities = [

        ...new Set(

            [

                ...data.map(item => item.city),

                ...locations.map(item => item.city)

            ]

            .map(city => String(city || "").trim())

            .filter(Boolean)

        )

    ]

    .sort(
        (a,b) =>
            a.localeCompare(
                b,
                "pl"
            )
    );



    $("#city").innerHTML =

        `<option value="">
            Wszystkie miasta
        </option>`

        +

        cities

        .map(city =>

            `<option value="${esc(city)}">
                ${esc(city)}
            </option>`

        )

        .join("");



    $("#city").value =
        selectedCity;



    $("#cities").innerHTML =

        cities

        .map(city =>

            `<option value="${esc(city)}">`

        )

        .join("");



    $("#types").innerHTML =

        [

            ...new Set(types)

        ]

        .sort(
            (a,b)=>
                a.localeCompare(
                    b,
                    "pl"
                )
        )

        .map(type =>

            `<option value="${esc(type)}">`

        )

        .join("");

}



/* =========================================================
   LISTA LOKALI
========================================================= */

function refreshLocals() {


    const city =
        norm(
            $("#editForm")
                .elements
                .city
                .value
        );


    const source = [

        ...locations,

        ...data.map(row => ({

            city: row.city,

            local: row.local

        }))

    ];



    const locals = [

        ...new Set(

            source

            .filter(row =>

                !city ||

                norm(row.city) === city

            )

            .map(row =>
                String(row.local || "")
                .trim()
            )

            .filter(Boolean)

        )

    ]

    .sort(
        (a,b)=>
            a.localeCompare(
                b,
                "pl"
            )
    );



    $("#locals").innerHTML =

        locals

        .map(local =>

            `<option value="${esc(local)}">`

        )

        .join("");

}

  /* =========================================================
   GENEROWANIE WIERSZY TABELI
========================================================= */

function rows(records) {

    return records.map(row => {

        const status = state(row);

        const protocolStatus = protocol(row);


        return `

        <tr>

            <td>
                <b>${esc(row.local)}</b>
            </td>


            <td>
                ${esc(row.type)}
            </td>


            <td>
                ${fmt(row.done)}
            </td>


            <td>
                ${fmt(
                    nextDate(
                        row.done,
                        row.months
                    )
                )}
            </td>


            <td>

                ${
                    status

                    ?

                    `<span class="badge ${
                        status.startsWith("PO")
                            ? "PO"
                            : status.startsWith("DO")
                                ? "DO"
                                : "OK"

                    }">

                        ${status}

                    </span>`

                    :

                    "—"

                }

            </td>


            <td>

                <span class="badge ${
                    protocolStatus === "DODANY"
                        ? "OK"
                        : "BRAK"

                }">

                    ${protocolStatus}

                </span>


                ${
                    row.protocolPath

                    ?

                    `

                    <button

                        type="button"

                        class="secondary"

                        data-action="open"

                        data-id="${esc(row.id)}">

                        Otwórz

                    </button>

                    `

                    :

                    ""

                }

            </td>


            <td>
                ${esc(row.notes)}
            </td>


            <td>

                <div class="row-actions">


                    <button

                        type="button"

                        class="secondary"

                        data-action="edit"

                        data-id="${esc(row.id)}">

                        Edytuj

                    </button>



                    <button

                        type="button"

                        class="danger"

                        data-action="delete"

                        data-id="${esc(row.id)}">

                        Usuń

                    </button>



                    <button

                        type="button"

                        class="secondary"

                        data-action="history"

                        data-id="${esc(row.id)}">

                        Historia

                    </button>


                </div>

            </td>


        </tr>

        `;

    }).join("");

}



/* =========================================================
   GŁÓWNE RENDEROWANIE
========================================================= */

function render() {


    refreshLists();


    const query =
        $("#search").value.toLowerCase();


    const selectedCity =
        $("#city").value;


    const selectedStatus =
        $("#status").value;


    const selectedProtocol =
        $("#protocol").value;



    const filtered = data

        .filter(row => {


            const matchesSearch =

                !query ||

                Object.values(row)

                    .join(" ")

                    .toLowerCase()

                    .includes(query);



            const matchesCity =

                !selectedCity ||

                row.city === selectedCity;



            const matchesStatus =

                !selectedStatus ||

                state(row) === selectedStatus;



            const matchesProtocol =

                !selectedProtocol ||

                protocol(row) === selectedProtocol;



            return (

                matchesSearch &&

                matchesCity &&

                matchesStatus &&

                matchesProtocol

            );


        })

        .sort((a,b) =>


            (

                nextDate(
                    a.done,
                    a.months
                )
                ||

                "9999"

            )

            .localeCompare(

                nextDate(
                    b.done,
                    b.months
                )

                ||

                "9999"

            )

        );



    // Statystyki

    [

        ["overdue", "PO TERMINIE"],

        ["due", "DO WYKONANIA"],

        ["ok", "OK"]

    ]

    .forEach(([id,status]) => {


        $("#" + id).textContent =

            data.filter(
                row =>
                    state(row) === status
            )

            .length;


    });


    $("#all").textContent =
        data.length;



    // Aktywne filtry

    document

        .querySelectorAll(
            "[data-quick-status]"
        )

        .forEach(button => {


            button.classList.toggle(

                "active",

                button.dataset.quickStatus === selectedStatus

            );


        });



    const openedCities = new Set(

        [

            ...

            document

                .querySelectorAll(
                    "#cityGroups details[open]"
                )

        ]

        .map(
            item =>
                item.dataset.city
        )

    );



    const cities = [

        ...

        new Set(

/* =========================================================
   ŁADOWANIE DANYCH Z SUPABASE
========================================================= */

async function load() {


    const [

        {
            data: inspections,
            error
        },


        {
            data: types,
            error: typesError
        },


        {
            data: locationsData,
            error: locationsError
        },


        {
            data: seedState,
            error: seedError
        }


    ] = await Promise.all([


        sb

            .from("inspections")

            .select("*")

            .is(
                "deleted_at",
                null
            )

            .order(
                "updated_at",
                {
                    ascending:false
                }
            ),



        sb

            .from("inspection_types")

            .select("name")

            .eq(
                "active",
                true
            )

            .order(
                "name"
            ),



        sb

            .from("locations")

            .select(
                "city,local"
            )

            .order(
                "city"
            )

            .order(
                "local"
            ),



        sb

            .from("app_state")

            .select("value")

            .eq(
                "key",
                "initial_seed_done"
            )

            .maybeSingle()


    ]);



    if(error){

        return showError(
            error.message
        );

    }



    if(
        typesError ||
        locationsError ||
        seedError
    ){

        return showError(

            [

                typesError,

                locationsError,

                seedError

            ]

            .filter(Boolean)

            .map(
                item =>
                    item.message
            )

            .join(" | ")

        );

    }



    typeCatalogAvailable = true;



    inspectionTypes =

        (types || [])

        .map(
            item =>
                item.name
        )

        .filter(Boolean);



    locations =

        (locationsData || [])

        .map(item => ({

            city:
                String(item.city || "")
                .trim(),


            local:
                String(item.local || "")
                .trim()

        }))

        .filter(
            item =>
                item.city &&
                item.local
        );



    data =

        (inspections || [])

        .map(fromDb);



    /*
       Pierwsze załadowanie danych
       z pliku dane-startowe.js
    */


    if(

        !data.length &&

        !seedState &&

        window.DEFAULT_DATA?.length

    ){


        const seed =

            window.DEFAULT_DATA.map(

                (row,index)=>

                    toDb({

                        ...row,

                        id:
                            row.id ||
                            `seed-${index+1}`

                    })

            );



        const {
            error: insertError
        }

        = await sb

            .from("inspections")

            .upsert(seed);



        if(insertError){

            return showError(
                insertError.message
            );

        }



        const {
            error: markError
        }

        = await sb

            .from("app_state")

            .upsert({

                key:
                    "initial_seed_done",

                value:
                    new Date()
                    .toISOString()

            });



        if(markError){

            return showError(
                markError.message
            );

        }



        return load();

    }



    render();



    $("#notice").hidden = true;



    $("#syncInfo").textContent =

        "Ostatnie odświeżenie: "

        +

        new Date()

        .toLocaleTimeString(
            "pl-PL"
        );


}

async function applySession(session){

/* =========================================================

========================================================= */

async function start(){


    if(!ready){


        showError(

            "Aplikacja wymaga konfiguracji Supabase w pliku supabase-config.js."

        );


        $("#add").disabled = true;


        return;

    }



    const {

        data:{
            session

        }

    }

    = await sb.auth.getSession();



    await applySession(session);



    sb.auth.onAuthStateChange(

        (_event,session)=>{

            applySession(session);

        }

    );



    sb

    .channel("live")


    .on(

        "postgres_changes",

        {

            event:"*",

            schema:"public",

            table:"inspections"

        },

        load

    )


    .on(

        "postgres_changes",

        {

            event:"*",

            schema:"public",

            table:"inspection_types"

        },

        load

    )


    .on(

        "postgres_changes",

        {

            event:"*",

            schema:"public",

            table:"locations"

        },

        load

    )


    .subscribe();


}

  /* =========================================================
   ZAPIS FORMULARZA PRZEGLĄDU
========================================================= */

$("#editForm").onsubmit = async event => {


    event.preventDefault();


    const submitButton =
        event.submitter;


    let uploadedPath = null;



    try {


        const formData =
            new FormData(
                event.target
            );



        const file =
            formData.get("file");



        const city =
            String(
                formData.get("city") || ""
            )
            .trim();



        const local =
            String(
                formData.get("local") || ""
            )
            .trim();



        const type =
            String(
                formData.get("type") || ""
            )
            .trim();



        const months =
            Number(
                formData.get("months")
            );



        /* -------------------------
           WALIDACJA
        ------------------------- */


        if(
            !city ||
            !local ||
            !type
        ){

            throw new Error(
                "Uzupełnij miasto, lokal i rodzaj przeglądu."
            );

        }



        if(
            !Number.isInteger(months) ||

            months < 1 ||

            months > 120

        ){

            throw new Error(
                "Okres ważności musi wynosić od 1 do 120 miesięcy."
            );

        }



        const duplicate =

            data.some(row =>


                String(row.id) !== String(editing)

                &&

                norm(row.city) === norm(city)

                &&

                norm(row.local) === norm(local)

                &&

                norm(row.type) === norm(type)

            );



        if(duplicate){

            throw new Error(
                "Taki przegląd dla tego lokalu już istnieje."
            );

        }



        /* -------------------------
           UPLOAD PROTOKOŁU
        ------------------------- */


        if(
            file &&
            file.size
        ){


            if(
                file.size >
                MAX_PROTOCOL_SIZE
            ){

                throw new Error(
                    "Plik protokołu może mieć maksymalnie 10 MB."
                );

            }



            if(
                !ALLOWED_PROTOCOL_TYPES.has(
                    file.type
                )
            ){

                throw new Error(
                    "Niedozwolony typ pliku protokołu."
                );

            }



            const extension =

                file.name

                    .split(".")

                    .pop()

                    .toLowerCase();



            const path =

                `${Date.now()}_${crypto.randomUUID()}.${extension}`;



            const {

                error

            } = await sb.storage

                .from("protocols")

                .upload(

                    path,

                    file,

                    {

                        contentType:
                            file.type

                    }

                );



            if(error){

                throw error;

            }



            uploadedPath = path;

        }



        if(submitButton){

            submitButton.disabled = true;

        }



        const oldRecord =

            data.find(

                row =>
                    String(row.id) === String(editing)

            );



        const payload = {


            id:

                editing ||

                `custom-${Date.now()}`,



            city,


            local,


            type,


            done:

                formData.get("done")

                ||

                null,



            months,



            protocolDate:

                formData.get("protocolDate")

                ||

                null,



            notes:

                formData.get("notes")

                ||

                ""

        };



        if(uploadedPath){


            payload.protocolFileName =
                file.name;



            payload.protocolPath =
                uploadedPath;



        }

        else if(oldRecord){


            payload.protocolFileName =
                oldRecord.protocolFileName;



            payload.protocolPath =
                oldRecord.protocolPath;


        }



        /* -------------------------
           ZAPIS DO BAZY
        ------------------------- */


        let saveError;



        if(editing){



            const {

                data:changed,

                error

            }

            = await sb

                .from("inspections")

                .update(
                    toDb(payload)
                )

                .eq(
                    "id",
                    editing
                )

                .eq(
                    "version",
                    editingVersion
                )

                .is(
                    "deleted_at",
                    null
                )

                .select("id");



            saveError = error;



            if(
                !saveError &&
                !changed?.length
            ){

                throw new Error(
                    "Ten wpis został zmieniony przez inną osobę. Odśwież dane i spróbuj ponownie."
                );

            }



        }

        else {



            const {

                error

            } = await sb

                .from("inspections")

                .insert(
                    toDb(payload)
                );



            saveError = error;

        }



        if(saveError){

            throw saveError;

        }



        /* -------------------------
           AKTUALIZACJA SŁOWNIKÓW
        ------------------------- */


        const {

            error:typeError

        } = await sb

            .from("inspection_types")

            .upsert(

                {

                    name:type,

                    active:true

                },

                {

                    onConflict:"name"

                }

            );



        if(typeError){

            throw typeError;

        }



        const {

            error:locationError

        } = await sb

            .from("locations")

            .upsert(

                {

                    city,

                    local

                },

                {

                    onConflict:"city,local"

                }

            );



        if(locationError){

            throw locationError;

        }



        /* -------------------------
           USUWANIE STAREGO PLIKU
        ------------------------- */


        if(

            uploadedPath &&

            oldRecord?.protocolPath &&

            oldRecord.protocolPath !== uploadedPath

        ){


            const {

                error:removeError

            } = await sb.storage

                .from("protocols")

                .remove([

                    oldRecord.protocolPath

                ]);



            if(removeError){

                console.warn(
                    "Nie udało się usunąć poprzedniego pliku:",
                    removeError.message
                );

            }

        }



        $("#editModal")

            .classList

            .remove("open");



        await load();



    }


    catch(error){


        if(uploadedPath){


            await sb.storage

                .from("protocols")

                .remove([

                    uploadedPath

                ]);

        }



        alert(

            "Błąd podczas zapisywania: "

            +

            error.message

        );


    }


    finally{


        if(submitButton){

            submitButton.disabled = false;

        }

    }


};

async function deleteRow(id) {

        data.find(
            item =>

        );



    if(
        !row ||
        !confirm(
            `Przenieść wpis „${row.local} — ${row.type}” do kosza? Można go później przywrócić.`
        )
    ){

        return;

    }



    const {

        data:changed,

        error

    } = await sb

        .from("inspections")

        .update({

            deleted_at:
                new Date()
                .toISOString()

        })

        .eq(
            "id",
            row.id
        )

        .eq(
            "version",
            row.version
        )

        .is(
            "deleted_at",
            null
        )

        .select("id");



    if(error){

        return alert(
            error.message
        );

    }



    if(!changed?.length){

        return alert(
            "Wpis został zmieniony przez inną osobę. Odśwież dane i spróbuj ponownie."
        );

    }



    await load();

}

                local

            },

            {

                onConflict:"city,local"

            }

        );



    if(error){

        return alert(
            "Nie udało się dodać lokalu: "
            +
            error.message
        );

    }



    $("#localModal")

        .classList

        .remove("open");



    await load();

};

  /* =========================================================
   ZARZĄDZANIE LOKALAMI
========================================================= */

$("#manageLocations").onclick = () => {

    $("#userMenu").hidden = true;


    renderLocations();


    $("#locationsModal")

        .classList

        .add("open");

};



$("#closeLocations").onclick = () => {

    $("#locationsModal")

        .classList

        .remove("open");

};



function renderLocations(){


    const grouped = {};


    locations.forEach(item => {


        if(!grouped[item.city]){

            grouped[item.city] = [];

        }


        grouped[item.city].push(
            item.local
        );


    });



    $("#locationsList").innerHTML =


        Object.entries(grouped)

        .map(([city,items]) => `


            <div class="location-group">


                <h4>
                    ${esc(city)}
                </h4>


                ${

                    items.map(local => `


                        <div class="location-row">


                            <span>
                                ${esc(local)}
                            </span>


                            <button

                                class="danger"

                                data-city="${esc(city)}"

                                data-local="${esc(local)}">

                                Usuń

                            </button>


                        </div>


                    `)

                    .join("")

                }


            </div>


        `)

        .join("");

}



/* Usuwanie lokalu */

$("#locationsList").onclick = async event => {


    const button =

        event.target.closest(
            "button[data-local]"
        );



    if(!button){

        return;

    }



    if(

        !confirm(
            `Usunąć lokal ${button.dataset.local}?`
        )

    ){

        return;

    }



    const {

        error

    } = await sb

        .from("locations")

        .delete()

        .eq(
            "city",
            button.dataset.city
        )

        .eq(
            "local",
            button.dataset.local
        );



    if(error){

        return alert(
            error.message
        );

    }



    await load();


    renderLocations();


};

/* =========================================================
   EKSPORT CSV
========================================================= */


$("#export").onclick = () => {


    const header = [

        "Miasto",

        "Lokal",

        "Rodzaj",

        "Wykonano",

        "Następny termin",

        "Status",

        "Protokół",

        "Uwagi"

    ];



    const csv = [


        header.join(","),



        ...data.map(row => [


            row.city,


            row.local,


            row.type,


            row.done,


            nextDate(
                row.done,
                row.months
            ),


            state(row),


            protocol(row),


            row.notes


        ]

        .map(value =>

            `"${String(value || "")

                .replace(/"/g,'""')

            }"`

        )

        .join(",")

        )


    ]

    .join("\n");



    const blob =

        new Blob(

            [

                "\ufeff" + csv

            ],

            {

                type:
                "text/csv;charset=utf-8"

            }

        );



    const url =

        URL.createObjectURL(
            blob
        );



    const link =
        document.createElement("a");



    link.href = url;



    link.download =
        "przeglady.csv";



    link.click();



    URL.revokeObjectURL(url);

};
