<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Przeglądy</title>
  <!-- Biblioteka do obsługi plików Excel w przeglądarce -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const $=s=>document.querySelector(s),config=window.APP_CONFIG||{},ready=Boolean(config.supabaseUrl&&config.supabaseAnonKey);

// Bezpieczny magazyn pamięci na przypadek blokady localStorage
const safeStorage = (() => {
  try {
    window.localStorage.setItem('__test', '1');
    window.localStorage.removeItem('__test');
    return window.localStorage;
  } catch (e) {
    const store = {};
    return {
      getItem: k => store[k] || null,
      setItem: (k, v) => { store[k] = String(v); },
      removeItem: k => { delete store[k]; }
    };
  }
})();

const sb = ready ? window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
  auth: {
    storage: safeStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
}) : null;

let data=[],inspectionTypes=[],locations=[],typeCatalogAvailable=false,editing=null,currentUser=null;
const defaultInspectionTypes=['Elektryczny (roczny)','Elektryczny (5-cio letni)','Systemy PPOŻ','Gaśnice','Klimatyzacja','Alarmy','Hydranty','Rolety','Wentylacja','Wymiana filtrów','Regałów magazynowych','CRO','Mroźnia/Chłodnia','Regały chłodnicze','Separatory tłuszczu','Vendingi','UDT (wózki widłowe, paleciaki)','BHP (drabiny, schodki, podesty)','Ansul','Okap','Brama garażowa','Żaluzje (gastro)','Bramki antykradzieżowe','Klamki na kod','Oświetlenie','Drzwi przeciwpożarowe','Drzwi na zaplecze','Systemy multmedialne','Posadzki, wykładziny','Kontrola kurzu','Light boxy','Floorboxy','Meble','Szyby','Lampy owadobójcze','Samochody','Windy w samochodach','Mycie jednostek klimatyzacji','Sprawdzenie pompy odpływowej'];

const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=v=>v?String(v).slice(0,10):'';
const format=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pl-PL'):'—';

function nextDate(done,months){if(!done||!months)return '';const d=new Date(done+'T12:00:00');d.setMonth(d.getMonth()+Number(months));return d.toISOString().slice(0,10)}
function state(r){const n=nextDate(r.done,r.months);if(!n)return '';const days=Math.ceil((new Date(n+'T12:00:00')-new Date())/86400000);return days<0?'PO TERMINIE':days<=14?'DO WYKONANIA':'OK'}
function protocol(r){return r.protocolFileName||r.protocolDate?'DODANY':'BRAK PROTOKOŁU'}
function inspectionCountLabel(count){
  const lastTwo=count%100,last=count%10;
  if(count===1)return '1 przegląd';
  if(lastTwo<12||lastTwo>14){
    if(last>=2&&last<=4)return `${count} przeglądy`;
  }
  return `${count} przeglądów`;
}

function fromDb(r){return{id:r.id,city:r.city,local:r.local,type:r.type,done:iso(r.done),months:r.months,protocolDate:iso(r.protocol_date),protocolFileName:r.protocol_file_name,protocolPath:r.protocol_path,notes:r.notes||''}}
function toDb(r){return{id:r.id,city:r.city.trim(),local:r.local.trim(),type:r.type.trim(),done:r.done||null,months:Number(r.months),protocol_date:r.protocolDate||null,protocol_file_name:r.protocolFileName||null,protocol_path:r.protocolPath||null,notes:r.notes||''}}

function refreshLists(){
  const currentSelectedCity=$('#city').value;
  const sourceTypes=typeCatalogAvailable?inspectionTypes:defaultInspectionTypes;
  const typeNames=[...new Set(sourceTypes.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  
  const allCities=[...data.map(x=>x.city), ...locations.map(x=>x.city)];
  const cities=[...new Set(allCities.map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  
  $('#city').innerHTML='<option value="">Wszystkie miasta</option>'+cities.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  $('#city').value=currentSelectedCity;
  
  $('#cities').innerHTML=cities.map(x=>`<option value="${esc(x)}">`).join('');
  $('#types').innerHTML=typeNames.map(x=>`<option value="${esc(x)}">`).join('');
}

function refreshLocalList(){
  const selectedCity=String($('#editForm').elements.city.value||'').trim().toLowerCase();
  
  const sourceLocations=[
    ...locations,
    ...data.map(row=>({city:row.city, local:row.local}))
  ];
  
  const localNames=[...new Set(
    sourceLocations
      .filter(row=>!selectedCity || String(row.city||'').trim().toLowerCase()===selectedCity)
      .map(row=>String(row.local||'').trim())
      .filter(Boolean)
  )].sort((a,b)=>a.localeCompare(b,'pl'));

  $('#locals').innerHTML=localNames.map(name=>`<option value="${esc(name)}">`).join('');
}

function renderTypeList(){
  const names=[...inspectionTypes].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#typeList').innerHTML=names.length?names.map(name=>`<li><span>${esc(name)}</span><button type="button" class="danger" data-action="delete-type" data-name="${esc(name)}">Usuń</button></li>`).join(''):'<li class="muted">Brak aktywnych rodzajów przeglądów.</li>';
}

function inspectionRows(records){
  return records.map(r=>{
    const s=state(r),p=protocol(r);
    return `<tr>
      <td><b>${esc(r.local)}</b></td>
      <td>${esc(r.type)}</td>
      <td>${format(r.done)}</td>
      <td>${format(nextDate(r.done,r.months))}</td>
      <td>${s?`<span class="badge ${s.startsWith('PO')?'PO':s.startsWith('DO')?'DO':'OK'}">${s}</span>`:'—'}</td>
      <td><span class="badge ${p==='DODANY'?'OK':'BRAK'}">${p}</span>${r.protocolPath?` <button type="button" class="secondary" data-action="open" data-id="${esc(r.id)}">Otwórz</button>`:''}</td>
      <td>${esc(r.notes)}</td>
      <td><button type="button" class="secondary" data-action="edit" data-id="${esc(r.id)}">Edytuj</button> <button type="button" class="danger" data-action="delete" data-id="${esc(r.id)}">Usuń</button></td>
    </tr>`;
  }).join('');
}

function render(){
  const q=$('#search').value.toLowerCase(),city=$('#city').value,st=$('#status').value,pr=$('#protocol').value;
  const shown=data.filter(r=>(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!city||r.city===city)&&(!st||state(r)===st)&&(!pr||protocol(r)===pr)).sort((a,b)=>(nextDate(a.done,a.months)||'9999').localeCompare(nextDate(b.done,b.months)||'9999'));
  
  for(const [id,s] of [['overdue','PO TERMINIE'],['due','DO WYKONANIA'],['ok','OK']])$('#'+id).textContent=data.filter(r=>state(r)===s).length;
  $('#all').textContent=data.length;
  document.querySelectorAll('[data-quick-status]').forEach(button=>{
    const active=button.dataset.quickStatus===st;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  
  const expanded=new Set([...document.querySelectorAll('#cityGroups details[open]')].map(x=>x.dataset.city));
  const cities=[...new Set(shown.map(r=>r.city||'Bez miasta'))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#cityGroups').innerHTML=cities.length?cities.map(cityName=>{
    const records=shown.filter(r=>(r.city||'Bez miasta')===cityName);
    const overdue=records.filter(r=>state(r)==='PO TERMINIE').length;
    const due=records.filter(r=>state(r)==='DO WYKONANIA').length;
    return `<details class="card city-group" data-city="${esc(cityName)}"${expanded.has(cityName)?' open':''}>
      <summary class="city-summary">
        <span class="city-summary-main"><strong>${esc(cityName)}</strong><span class="city-summary-count">${inspectionCountLabel(records.length)}</span></span>
        <span class="city-summary-stats">${overdue?`<span class="badge PO">Po terminie: ${overdue}</span>`:''}${due?`<span class="badge DO">Do wykonania: ${due}</span>`:''}</span>
      </summary>
      <div class="city-table tablebox"><table>
        <thead><tr><th>Lokal</th><th>Rodzaj</th><th>Wykonano</th><th>Następny termin</th><th>Status</th><th>Protokół</th><th>Uwagi</th><th></th></tr></thead>
        <tbody>${inspectionRows(records)}</tbody>
      </table></div>
    </details>`;
  }).join(''):'<div class="notice">Brak przeglądów spełniających wybrane kryteria.</div>';
}

async function load(){
  const [{data:rows,error},{data:typeRows,error:typeError},{data:locationRows,error:locationError}]=await Promise.all([
    sb.from('inspections').select('*').limit(5000).order('updated_at',{ascending:false}),
    sb.from('inspection_types').select('name').limit(1000).eq('active',true).order('name'),
    sb.from('locations').select('city,local').limit(5000).order('city').order('local')
  ]);
  if(error)return showError(error.message);
  if(typeError)console.warn('Nie udało się pobrać słownika rodzajów przeglądów:',typeError.message);
  if(locationError)console.warn('Nie udało się pobrać listy lokali:',locationError.message);
  typeCatalogAvailable=!typeError;
  inspectionTypes=(typeRows||[]).map(row=>row.name).filter(Boolean);
  locations=(locationRows||[]).map(row=>({city:String(row.city||'').trim(),local:String(row.local||'').trim()})).filter(row=>row.city||row.local);
  data=rows.map(fromDb);
  
  refreshLists();
  render();
  $('#notice').hidden=true;
  $('#syncInfo').textContent=`Ostatnie odświeżenie: ${new Date().toLocaleTimeString('pl-PL')}`;
}

function showError(message){$('#notice').hidden=false;$('#notice').textContent='Nie można połączyć się z rejestrem: '+message}

async function start(){
  if(!ready){$('#notice').hidden=false;$('#notice').textContent='Aplikacja wymaga konfiguracji Supabase w pliku supabase-config.js.';$('#add').disabled=true;return}
  const {data:{session}}=await sb.auth.getSession();
  await applySession(session);
  sb.auth.onAuthStateChange((_e,s)=>applySession(s));
  sb.channel('inspections-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'inspections'},()=>load())
    .on('postgres_changes',{event:'*',schema:'public',table:'inspection_types'},()=>load())
    .on('postgres_changes',{event:'*',schema:'public',table:'locations'},()=>load())
    .subscribe();
}

async function applySession(session){
  currentUser=session?.user||null;
  $('#user').textContent=currentUser?.email||'';
  $('#logout').hidden=!currentUser;
  $('#loginModal').classList.toggle('open',!currentUser);
  if(currentUser)await load();
}

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  $('#loginMessage').textContent=error?error.message:'';
};

$('#register').onclick=async()=>{
  if(!config.allowRegistration)return $('#loginMessage').textContent='Rejestracja jest wyłączona. Poproś administratora o utworzenie konta.';
  const f=new FormData($('#loginForm')),{error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password')});
  $('#loginMessage').textContent=error?error.message:'Sprawdź skrzynkę e-mail i potwierdź konto.';
};

$('#logout').onclick=()=>sb.auth.signOut();
$('#add').onclick=()=>openForm();
$('#cancel').onclick=()=>$('#editModal').classList.remove('open');

function openForm(r=null){
  editing=r?.id||null;
  const f=$('#editForm');
  f.reset();
  const values=r||{months:12};
  ['city','local','type','done','months','protocolDate','notes'].forEach(name=>{if(f.elements[name])f.elements[name].value=values[name]??''});
  refreshLocalList();
  const editMode=Boolean(r);
  ['city','local','type','months','notes'].forEach(name=>{if(f.elements[name])f.elements[name].readOnly=editMode});
  $('#formTitle').textContent=editMode?'Edytuj datę lub protokół':'Dodaj przegląd';
  $('#fileInfo').textContent=r?.protocolFileName?`Obecny plik: ${r.protocolFileName}. Wybranie nowego zastąpi obecny.`:'Opcjonalnie: PDF, dokument lub zdjęcie.';
  $('#editModal').classList.add('open');
}

$('#editForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    const f=new FormData(e.target),file=f.get('file');
    let protocolFileName=null,protocolPath=null;
    if(file&&file.size>0){
      const ext=file.name.split('.').pop(),path=`${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const {error:uploadErr}=await sb.storage.from('protocols').upload(path,file);
      if(uploadErr)throw new Error('Błąd przesyłania pliku: '+uploadErr.message);
      protocolFileName=file.name;protocolPath=path;
    }
    const payload={
      id:editing||`custom-${Date.now()}`,
      city:f.get('city'),
      local:f.get('local'),
      type:f.get('type'),
      done:f.get('done')||null,
      months:Number(f.get('months')),
      protocolDate:f.get('protocolDate')||null,
      notes:f.get('notes')||''
    };
    if(protocolFileName){
      payload.protocolFileName=protocolFileName;payload.protocolPath=protocolPath;
    }else if(editing){
      const existing=data.find(r=>String(r.id)===String(editing));
      if(existing){payload.protocolFileName=existing.protocolFileName;payload.protocolPath=existing.protocolPath;}
    }
    const dbRecord=toDb(payload);
    const {error}=await sb.from('inspections').upsert([dbRecord]);
    if(error)throw error;

    if(payload.city && payload.local){
      sb.from('locations').upsert({city:payload.city.trim(),local:payload.local.trim()},{onConflict:'city,local'}).then(({error:locErr})=>{
        if(locErr)console.warn('Wpis zapisano, ale nie udało się dodać lokalizacji do słownika:',locErr.message);
      });
    }

    const typeName=String(payload.type||'').trim();
    if(typeName){
      const {error:typeError}=await sb.from('inspection_types').upsert({name:typeName,active:true},{onConflict:'name'});
      if(typeError)console.warn('Wpis zapisano, ale nie udało się dodać rodzaju do słownika:',typeError.message);
    }
    $('#editModal').classList.remove('open');
    await load();
  }catch(err){
    alert('Błąd podczas zapisywania: '+err.message);
  }
};

async function editRow(id){
  const record=data.find(r=>String(r.id)===String(id));
  if(!record)return alert('Nie odnaleziono wpisu. Odśwież stronę i spróbuj ponownie.');
  openForm(record);
}

async function deleteRow(id){
  try{
    const record=data.find(r=>String(r.id)===String(id));
    if(!record)return alert('Nie odnaleziono wpisu. Odśwież stronę i spróbuj ponownie.');
    if(!confirm(`Usunąć wpis „${record.local} — ${record.type}”?`))return;
    const {data:deleted,error}=await sb.from('inspections').delete().eq('id',record.id).select('id');
    if(error)throw new Error(error.message);
    if(!deleted?.length)throw new Error('Brak potwierdzenia usunięcia. Konto nie ma uprawnienia do usuwania lub wpis został już zmieniony.');
    data=data.filter(item=>String(item.id)!==String(record.id));
    render();
    $('#syncInfo').textContent='Wpis został usunięty.';
    if(record.protocolPath){
      const {error:fileError}=await sb.storage.from('protocols').remove([record.protocolPath]);
      if(fileError)console.warn('Wpis usunięto, ale plik protokołu pozostał:',fileError.message);
    }
  }catch(error){
    alert(`Nie udało się usunąć wpisu: ${error.message}`);
  }
}

async function openFile(id){
  const record=data.find(r=>String(r.id)===String(id));
  if(!record?.protocolPath)return;
  const {data:link,error}=await sb.storage.from('protocols').createSignedUrl(record.protocolPath,60);
  if(error)return alert(error.message);
  window.open(link.signedUrl,'_blank','noopener');
}

$('#cityGroups').addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action]');
  if(!button)return;
  const {action,id}=button.dataset;
  if(action==='edit')await editRow(id);
  if(action==='delete')await deleteRow(id);
  if(action==='open')await openFile(id);
});

['search','city','status','protocol'].forEach(x=>$('#'+x).addEventListener(x==='search'?'input':'change',render));
$('#editForm').elements.city.addEventListener('input',refreshLocalList);

// AUTOMATYCZNE UZUPEŁNIANIE MIESIĘCY WAŻNOŚCI W ZALEŻNOŚCI OD RODZAJU PRZEGLĄDU
$('#editForm').elements.type.addEventListener('input', e => {
  const typeValue = e.target.value.trim().toLowerCase();
  
  // Słownik z przypisanymi miesiącami
  const monthsMap = {
    'elektryczny (5-cio letni)': 60,
    'elektryczny (roczny)': 12,
    'klimatyzacja': 3,
    'mycie jednostek klimatyzacji': 36,
    'wentylacja': 12,
    'rolety': 12,
    'rolety sklepowe': 12,
    'gaśnice': 12,
    'oświetlenie': 1,
    'sprawdzenie pompy odpływowej': 2
  };
  
  // Jeśli wpisany rodzaj znajduje się w słowniku, ustawiamy miesiące
  if (monthsMap[typeValue] !== undefined) {
    $('#editForm').elements.months.value = monthsMap[typeValue];
  }
});

$('#manageTypes').onclick=()=>{
  renderTypeList();
  $('#typesModal').classList.add('open');
};
$('#closeTypes').onclick=()=>$('#typesModal').classList.remove('open');
$('#addType').onclick=async()=>{
  const name=$('#newType').value.trim();
  if(!name)return;
  const {error}=await sb.from('inspection_types').upsert({name,active:true},{onConflict:'name'});
  if(error)return alert('Nie udało się dodać rodzaju: '+error.message);
  if(!inspectionTypes.includes(name))inspectionTypes.push(name);
  $('#newType').value='';
  refreshLists();
  renderTypeList();
};
$('#typeList').addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action="delete-type"]');
  if(!button)return;
  const name=button.dataset.name;
  if(!confirm(`Usunąć „${name}” z listy rodzajów przeglądów? Istniejące wpisy pozostaną bez zmian.`))return;
  const {error}=await sb.from('inspection_types').update({active:false}).eq('name',name);
  if(error)return alert('Nie udało się usunąć rodzaju: '+error.message);
  inspectionTypes=inspectionTypes.filter(item=>item!==name);
  refreshLists();
  renderTypeList();
});

document.querySelectorAll('[data-quick-status]').forEach(button=>button.addEventListener('click',()=>{
  const status=button.dataset.quickStatus;
  $('#status').value=status&&$('#status').value===status?'':status;
  render();
}));

async function handleExcelImport(file){
  const dataBuf = await file.arrayBuffer();
  const workbook = XLSX.read(dataBuf);
  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
  
  let importedCount = 0;
  for(let i=1; i<rows.length; i++){
    const city = String(rows[i][1]||'').trim();
    const local = String(rows[i][2]||'').trim();
    if(city && local && local !== 'Wszystkie lokale'){
      const {error} = await sb.from('locations').upsert({city, local}, {onConflict: 'city,local'});
      if(!error) importedCount++;
    }
  }
  alert(`Zaimportowano pomyślnie ${importedCount} lokalizacji z pliku Excel!`);
  load();
}

const fileInput = document.createElement('input');
fileInput.type = 'file';
fileInput.accept = '.xlsx, .xls';
fileInput.style.display = 'none';
fileInput.onchange = e => { if(e.target.files[0]) handleExcelImport(e.target.files[0]); };
document.body.appendChild(fileInput);

$('#export').onclick=()=>{
  const h=['Miasto','Nr lokalu','Rodzaj przeglądu','Data wykonania','Ważny przez (mies.)','Data następnego przeglądu','Status','Data dodania protokołu','Uwagi'];
  const csv=[h,...data.map(r=>[r.city,r.local,r.type,r.done,r.months,nextDate(r.done,r.months),state(r),r.protocolDate,r.notes])].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='przeglady-export.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

start();
</script>
</body>
</html>
