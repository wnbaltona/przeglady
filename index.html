<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Przeglądy</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="dane-startowe.js"></script>
  <style>
    :root{--n:#12304a;--b:#075985;--bg:#f1f5f9;--line:#cbd5e1;--red:#991b1b;--amber:#92400e;--green:#065f46}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font:14px system-ui,Segoe UI,Arial;color:#172033}
    .top{background:var(--n);color:#fff;padding:22px max(20px,calc((100% - 1280px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:4px solid #38bdf8}
    .top h1{margin:0;font-size:26px}
    .top p{margin:4px 0 0;color:#dbeafe}
    .wrap{max-width:1300px;margin:24px auto;padding:0 18px}
    .notice,.panel,.card{background:#fff;border:1px solid var(--line);border-radius:12px}
    .notice{padding:15px 17px;margin-bottom:16px;background:#e0f2fe;color:#123e5c;border-left:4px solid var(--b)}
    .panel{padding:16px;margin-bottom:16px}
    .tools,.filters,.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .filters{margin-top:14px}
    .filters input,.filters select{flex:1;min-width:155px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
    .stat{width:100%;padding:15px;border:1px solid var(--line);border-left:5px solid #64748b;background:#fff;color:#172033;text-align:left;transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
    .stat b{display:block;font-size:27px;margin-top:4px}
    .stat:hover{transform:translateY(-2px);box-shadow:0 8px 18px #0f172a18}
    .stat:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}
    .stat.active{box-shadow:0 0 0 3px #38bdf866,0 8px 18px #0f172a18}
    .overdue{border-color:#ef4444}
    .due{border-color:#f59e0b}
    .ok{border-color:#10b981}
    .total{border-color:#075985}
    .city-groups{display:grid;gap:12px}
    .city-group{overflow:hidden}
    .city-summary{display:flex;align-items:center;gap:14px;padding:16px 18px 16px 13px;cursor:pointer;list-style:none;background:#fff}
    .city-summary::-webkit-details-marker{display:none}
    .city-summary::after{content:'›';font-size:25px;line-height:1;transform:rotate(0deg);transition:transform .18s ease;color:var(--b);margin-left:4px}
    .city-group[open] .city-summary::after{transform:rotate(90deg)}
    .city-summary-main{display:flex;align-items:baseline;gap:10px;min-width:0}
    .city-summary strong{font-size:17px}
    .city-summary-count{color:#475569;white-space:nowrap}
    .city-summary-stats{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
    .city-table{border-top:1px solid var(--line);padding:0 12px 12px;background:#f8fafc}
    .tablebox{overflow:auto;max-height:62vh}
    table{border-collapse:collapse;width:100%;min-width:980px}
    th,td{padding:11px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}
    th{position:sticky;top:0;background:#eaf0f6;color:#334155;font-size:12px}
    button{border:0;border-radius:8px;background:var(--b);color:white;padding:10px 13px;font:inherit;font-weight:700;cursor:pointer}
    .secondary{background:#e2e8f0;color:#172033}
    .danger{background:#fee2e2;color:var(--red)}
    input,select,textarea{border:1px solid #94a3b8;border-radius:8px;padding:9px;background:#fff;font:inherit}
    .badge{padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
    .PO{background:#fee2e2;color:var(--red)}
    .DO{background:#fef3c7;color:var(--amber)}
    .OK{background:#d1fae5;color:var(--green)}
    .BRAK{background:#ede9fe;color:#5b21b6}
    .modal{display:none;position:fixed;inset:0;background:#17203388;place-items:center;padding:18px}
    .modal.open{display:grid}
    .dialog{background:#fff;border-radius:14px;padding:24px;width:min(720px,100%);max-height:90vh;overflow:auto}
    .form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
    .form label{display:grid;gap:5px;font-weight:650}
    .wide{grid-column:1/-1}
    .dialog footer{display:flex;justify-content:flex-end;gap:9px;margin-top:19px}
    .muted{color:#475569}
    .top .secondary{background:#fff;color:var(--n)}
    #user{font-weight:650}
    @media(max-width:700px){
      .top{align-items:flex-start;flex-direction:column}
      .stats{grid-template-columns:repeat(2,1fr)}
      .form{grid-template-columns:1fr}
      .wide{grid-column:auto}
    }
  </style>
</head>
<body>
<header class="top">
  <div><h1>Przeglądy</h1><p>Wspólny rejestr, terminy i protokoły <small id="version">wersja 2.4</small></p></div>
  <div class="actions"><span id="user"></span><button id="logout" class="secondary" hidden>Wyloguj</button><button id="add">+ Dodaj przegląd</button></div>
</header>
<main class="wrap">
  <div id="notice" class="notice">Trwa łączenie ze wspólnym rejestrem…</div>
  <section class="panel">
    <div class="tools"><button id="export" class="secondary">Eksportuj CSV</button><span id="syncInfo" class="muted"></span></div>
    <div class="filters">
      <input id="search" placeholder="Szukaj: miasto, lokal, rodzaj…">
      <select id="city"><option value="">Wszystkie miasta</option></select>
      <select id="status"><option value="">Wszystkie statusy</option><option>PO TERMINIE</option><option>DO WYKONANIA</option><option>OK</option></select>
      <select id="protocol"><option value="">Wszystkie protokoły</option><option value="DODANY">Dodany</option><option value="BRAK PROTOKOŁU">Brak protokołu</option></select>
    </div>
  </section>
  <section class="stats">
    <button type="button" class="card stat overdue" data-quick-status="PO TERMINIE" aria-pressed="false">Po terminie<b id="overdue">0</b></button>
    <button type="button" class="card stat due" data-quick-status="DO WYKONANIA" aria-pressed="false">Do wykonania (14 dni)<b id="due">0</b></button>
    <button type="button" class="card stat ok" data-quick-status="OK" aria-pressed="false">Aktualne<b id="ok">0</b></button>
    <button type="button" class="card stat total" data-quick-status="" aria-pressed="true">Wszystkie wpisy<b id="all">0</b></button>
  </section>
  <section id="cityGroups" class="city-groups" aria-label="Przeglądy według miast"></section>
</main>

<div class="modal" id="loginModal">
  <form class="dialog" id="loginForm">
    <h2>Dostęp do rejestru</h2>
    <p>Logowanie jest wymagane, aby dane działu były wspólne i chronione.</p>
    <div class="form">
      <label class="wide">E-mail<input required type="email" name="email" autocomplete="email"></label>
      <label class="wide">Hasło<input required type="password" name="password" autocomplete="current-password"></label>
    </div>
    <p id="loginMessage" class="muted"></p>
    <footer><button type="button" id="register" class="secondary">Utwórz konto</button><button>Zaloguj</button></footer>
  </form>
</div>

<div class="modal" id="editModal">
  <form class="dialog" id="editForm">
    <h2 id="formTitle">Dodaj przegląd</h2>
    <div class="form">
      <label>Miasto<input required name="city" list="cities"></label>
      <label>Nr lokalu<input required name="local"></label>
      <label>Rodzaj przeglądu<input required name="type" list="types"></label>
      <label>Data wykonania<input required type="date" name="done"></label>
      <label>Ważny przez (mies.)<input required min="1" type="number" name="months" value="12"></label>
      <label>Data dodania protokołu<input type="date" name="protocolDate"></label>
      <label class="wide">Plik protokołu<input type="file" name="file" accept=".pdf,.doc,.docx,.xls,.xlsx,image/*"><small id="fileInfo" class="muted">Opcjonalnie: PDF, dokument lub zdjęcie.</small></label>
      <label class="wide">Uwagi<textarea name="notes" rows="3"></textarea></label>
    </div>
    <footer><button type="button" id="cancel" class="secondary">Anuluj</button><button>Zapisz</button></footer>
  </form>
</div>

<datalist id="cities"></datalist>
<datalist id="types"></datalist>

<script>
const $=s=>document.querySelector(s),config=window.APP_CONFIG||{},ready=Boolean(config.supabaseUrl&&config.supabaseAnonKey);

// Bezpieczny magazyn pamięci na przypadek blokady localStorage (Tracking Prevention)
const safeStorage = (() => {
  try {
    window.localStorage.setItem('__test', '1');
    window.localStorage.removeItem('__test');
    return window.localStorage;
  } catch (e) {
    const store = {};
    return {
      getItem: k => store[k] || null,
      setItem: (k, v) => { store[k] = String(v); },
      removeItem: k => { delete store[k]; }
    };
  }
})();

const sb = ready ? window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
  auth: {
    storage: safeStorage,
    persistSession: true,
    autoRefreshToken: true,
    detectSessionInUrl: true
  }
}) : null;

let data=[],inspectionTypes=[],editing=null,currentUser=null;
const defaultInspectionTypes=['Elektryczny (roczny)','Elektryczny (5-cio letni)','Systemy PPOŻ','Gaśnice','Klimatyzacja','Alarmy','Hydranty','Rolety','Wentylacja','Wymiana filtrów','Regałów magazynowych','CRO','Mroźnia/Chłodnia','Regały chłodnicze','Separatory tłuszczu','Vendingi','UDT (wózki widłowe, paleciaki)','BHP (drabiny, schodki, podesty)','Ansul','Okap','Brama garażowa','Żaluzje (gastro)','Bramki antykradzieżowe','Klamki na kod','Oświetlenie','Drzwi przeciwpożarowe','Drzwi na zaplecze','Systemy multmedialne','Posadzki, wykładziny','Kontrola kurzu','Light boxy','Floorboxy','Meble','Szyby','Lampy owadobójcze','Samochody','Windy w samochodach','Mycie jednostek klimatyzacji','Sprawdzenie pompy odpływowej','ffff'];

const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=v=>v?String(v).slice(0,10):'';
const format=v=>v?new Date(v+'T12:00:00').toLocaleDateString('pl-PL'):'—';

function nextDate(done,months){if(!done||!months)return '';const d=new Date(done+'T12:00:00');d.setMonth(d.getMonth()+Number(months));return d.toISOString().slice(0,10)}
function state(r){const n=nextDate(r.done,r.months);if(!n)return '';const days=Math.ceil((new Date(n+'T12:00:00')-new Date())/86400000);return days<0?'PO TERMINIE':days<=14?'DO WYKONANIA':'OK'}
function protocol(r){return r.protocolFileName||r.protocolDate?'DODANY':'BRAK PROTOKOŁU'}
function inspectionCountLabel(count){
  const lastTwo=count%100,last=count%10;
  if(count===1)return '1 przegląd';
  if(lastTwo<12||lastTwo>14){
    if(last>=2&&last<=4)return `${count} przeglądy`;
  }
  return `${count} przeglądów`;
}

function fromDb(r){return{id:r.id,city:r.city,local:r.local,type:r.type,done:iso(r.done),months:r.months,protocolDate:iso(r.protocol_date),protocolFileName:r.protocol_file_name,protocolPath:r.protocol_path,notes:r.notes||''}}
function toDb(r){return{id:r.id,city:r.city.trim(),local:r.local.trim(),type:r.type.trim(),done:r.done||null,months:Number(r.months),protocol_date:r.protocolDate||null,protocol_file_name:r.protocolFileName||null,protocol_path:r.protocolPath||null,notes:r.notes||''}}

function refreshLists(){
  const city=$('#city').value,typeNames=[...new Set([...defaultInspectionTypes,...inspectionTypes,...data.map(x=>x.type)].map(x=>String(x||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl')),cities=[...new Set(data.map(x=>x.city).filter(Boolean))].sort();
  $('#city').innerHTML='<option value="">Wszystkie miasta</option>'+cities.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  $('#city').value=city;
  $('#cities').innerHTML=cities.map(x=>`<option value="${esc(x)}">`).join('');
  $('#types').innerHTML=typeNames.map(x=>`<option value="${esc(x)}">`).join('');
}

function inspectionRows(records){
  return records.map(r=>{
    const s=state(r),p=protocol(r);
    return `<tr>
      <td><b>${esc(r.local)}</b></td>
      <td>${esc(r.type)}</td>
      <td>${format(r.done)}</td>
      <td>${format(nextDate(r.done,r.months))}</td>
      <td>${s?`<span class="badge ${s.startsWith('PO')?'PO':s.startsWith('DO')?'DO':'OK'}">${s}</span>`:'—'}</td>
      <td><span class="badge ${p==='DODANY'?'OK':'BRAK'}">${p}</span>${r.protocolPath?` <button type="button" class="secondary" data-action="open" data-id="${esc(r.id)}">Otwórz</button>`:''}</td>
      <td>${esc(r.notes)}</td>
      <td><button type="button" class="secondary" data-action="edit" data-id="${esc(r.id)}">Edytuj</button> <button type="button" class="danger" data-action="delete" data-id="${esc(r.id)}">Usuń</button></td>
    </tr>`;
  }).join('');
}

function render(){
  refreshLists();
  const q=$('#search').value.toLowerCase(),city=$('#city').value,st=$('#status').value,pr=$('#protocol').value;
  const shown=data.filter(r=>(!q||Object.values(r).join(' ').toLowerCase().includes(q))&&(!city||r.city===city)&&(!st||state(r)===st)&&(!pr||protocol(r)===pr)).sort((a,b)=>(nextDate(a.done,a.months)||'9999').localeCompare(nextDate(b.done,b.months)||'9999'));
  
  for(const [id,s] of [['overdue','PO TERMINIE'],['due','DO WYKONANIA'],['ok','OK']])$('#'+id).textContent=data.filter(r=>state(r)===s).length;
  $('#all').textContent=data.length;
  document.querySelectorAll('[data-quick-status]').forEach(button=>{
    const active=button.dataset.quickStatus===st;
    button.classList.toggle('active',active);
    button.setAttribute('aria-pressed',String(active));
  });
  
  const expanded=new Set([...document.querySelectorAll('#cityGroups details[open]')].map(x=>x.dataset.city));
  const cities=[...new Set(shown.map(r=>r.city||'Bez miasta'))].sort((a,b)=>a.localeCompare(b,'pl'));
  $('#cityGroups').innerHTML=cities.length?cities.map(cityName=>{
    const records=shown.filter(r=>(r.city||'Bez miasta')===cityName);
    const overdue=records.filter(r=>state(r)==='PO TERMINIE').length;
    const due=records.filter(r=>state(r)==='DO WYKONANIA').length;
    return `<details class="card city-group" data-city="${esc(cityName)}"${expanded.has(cityName)?' open':''}>
      <summary class="city-summary">
        <span class="city-summary-main"><strong>${esc(cityName)}</strong><span class="city-summary-count">${inspectionCountLabel(records.length)}</span></span>
        <span class="city-summary-stats">${overdue?`<span class="badge PO">Po terminie: ${overdue}</span>`:''}${due?`<span class="badge DO">Do wykonania: ${due}</span>`:''}</span>
      </summary>
      <div class="city-table tablebox"><table>
        <thead><tr><th>Lokal</th><th>Rodzaj</th><th>Wykonano</th><th>Następny termin</th><th>Status</th><th>Protokół</th><th>Uwagi</th><th></th></tr></thead>
        <tbody>${inspectionRows(records)}</tbody>
      </table></div>
    </details>`;
  }).join(''):'<div class="notice">Brak przeglądów spełniających wybrane kryteria.</div>';
}

async function load(){
  const [{data:rows,error},{data:typeRows,error:typeError}]=await Promise.all([
    sb.from('inspections').select('*').order('updated_at',{ascending:false}),
    sb.from('inspection_types').select('name').order('name')
  ]);
  if(error)return showError(error.message);
  if(typeError)console.warn('Nie udało się pobrać słownika rodzajów przeglądów:',typeError.message);
  inspectionTypes=(typeRows||[]).map(row=>row.name).filter(Boolean);
  data=rows.map(fromDb);
  if(!data.length&&window.DEFAULT_DATA?.length){
    const seed=window.DEFAULT_DATA.map((r,i)=>toDb({...r,id:r.id||`seed-${i+1}`}));
    const {error:e}=await sb.from('inspections').upsert(seed);
    if(e)return showError(e.message);
    return load();
  }
  render();
  $('#notice').hidden=true;
  $('#syncInfo').textContent=`Ostatnie odświeżenie: ${new Date().toLocaleTimeString('pl-PL')}`;
}

function showError(message){$('#notice').hidden=false;$('#notice').textContent='Nie można połączyć się z rejestrem: '+message}

async function start(){
  if(!ready){$('#notice').hidden=false;$('#notice').textContent='Aplikacja wymaga konfiguracji Supabase w pliku supabase-config.js.';$('#add').disabled=true;return}
  const {data:{session}}=await sb.auth.getSession();
  await applySession(session);
  sb.auth.onAuthStateChange((_e,s)=>applySession(s));
  sb.channel('inspections-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'inspections'},()=>load())
    .on('postgres_changes',{event:'*',schema:'public',table:'inspection_types'},()=>load())
    .subscribe();
}

async function applySession(session){
  currentUser=session?.user||null;
  $('#user').textContent=currentUser?.email||'';
  $('#logout').hidden=!currentUser;
  $('#loginModal').classList.toggle('open',!currentUser);
  if(currentUser)await load();
}

$('#loginForm').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});
  $('#loginMessage').textContent=error?error.message:'';
};

$('#register').onclick=async()=>{
  if(!config.allowRegistration)return $('#loginMessage').textContent='Rejestracja jest wyłączona. Poproś administratora o utworzenie konta.';
  const f=new FormData($('#loginForm')),{error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password')});
  $('#loginMessage').textContent=error?error.message:'Sprawdź skrzynkę e-mail i potwierdź konto.';
};

$('#logout').onclick=()=>sb.auth.signOut();
$('#add').onclick=()=>openForm();
$('#cancel').onclick=()=>$('#editModal').classList.remove('open');

function openForm(r=null){
  editing=r?.id||null;
  const f=$('#editForm');
  f.reset();
  const values=r||{months:12};
  ['city','local','type','done','months','protocolDate','notes'].forEach(name=>{if(f.elements[name])f.elements[name].value=values[name]??''});
  const editMode=Boolean(r);
  ['city','local','type','months','notes'].forEach(name=>{if(f.elements[name])f.elements[name].readOnly=editMode});
  $('#formTitle').textContent=editMode?'Edytuj datę lub protokół':'Dodaj przegląd';
  $('#fileInfo').textContent=r?.protocolFileName?`Obecny plik: ${r.protocolFileName}. Wybranie nowego zastąpi obecny.`:'Opcjonalnie: PDF, dokument lub zdjęcie.';
  $('#editModal').classList.add('open');
}

$('#editForm').onsubmit=async e=>{
  e.preventDefault();
  try{
    const f=new FormData(e.target),file=f.get('file');
    let protocolFileName=null,protocolPath=null;
    if(file&&file.size>0){
      const ext=file.name.split('.').pop(),path=`${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const {error:uploadErr}=await sb.storage.from('protocols').upload(path,file);
      if(uploadErr)throw new Error('Błąd przesyłania pliku: '+uploadErr.message);
      protocolFileName=file.name;protocolPath=path;
    }
    const payload={
      id:editing||`custom-${Date.now()}`,
      city:f.get('city'),
      local:f.get('local'),
      type:f.get('type'),
      done:f.get('done')||null,
      months:Number(f.get('months')),
      protocolDate:f.get('protocolDate')||null,
      notes:f.get('notes')||''
    };
    if(protocolFileName){
      payload.protocolFileName=protocolFileName;payload.protocolPath=protocolPath;
    }else if(editing){
      const existing=data.find(r=>String(r.id)===String(editing));
      if(existing){payload.protocolFileName=existing.protocolFileName;payload.protocolPath=existing.protocolPath;}
    }
    const dbRecord=toDb(payload);
    const {error}=await sb.from('inspections').upsert([dbRecord]);
    if(error)throw error;
    const typeName=String(payload.type||'').trim();
    if(typeName){
      const {error:typeError}=await sb.from('inspection_types').upsert({name:typeName},{onConflict:'name'});
      if(typeError)console.warn('Wpis zapisano, ale nie udało się dodać rodzaju do słownika:',typeError.message);
    }
    $('#editModal').classList.remove('open');
    await load();
  }catch(err){
    alert('Błąd podczas zapisywania: '+err.message);
  }
};

async function editRow(id){
  const record=data.find(r=>String(r.id)===String(id));
  if(!record)return alert('Nie odnaleziono wpisu. Odśwież stronę i spróbuj ponownie.');
  openForm(record);
}

async function deleteRow(id){
  try{
    const record=data.find(r=>String(r.id)===String(id));
    if(!record)return alert('Nie odnaleziono wpisu. Odśwież stronę i spróbuj ponownie.');
    if(!confirm(`Usunąć wpis „${record.local} — ${record.type}”?`))return;
    const {data:deleted,error}=await sb.from('inspections').delete().eq('id',record.id).select('id');
    if(error)throw new Error(error.message);
    if(!deleted?.length)throw new Error('Brak potwierdzenia usunięcia. Konto nie ma uprawnienia do usuwania lub wpis został już zmieniony.');
    data=data.filter(item=>String(item.id)!==String(record.id));
    render();
    $('#syncInfo').textContent='Wpis został usunięty.';
    if(record.protocolPath){
      const {error:fileError}=await sb.storage.from('protocols').remove([record.protocolPath]);
      if(fileError)console.warn('Wpis usunięto, ale plik protokołu pozostał:',fileError.message);
    }
  }catch(error){
    alert(`Nie udało się usunąć wpisu: ${error.message}`);
  }
}

async function openFile(id){
  const record=data.find(r=>String(r.id)===String(id));
  if(!record?.protocolPath)return;
  const {data:link,error}=await sb.storage.from('protocols').createSignedUrl(record.protocolPath,60);
  if(error)return alert(error.message);
  window.open(link.signedUrl,'_blank','noopener');
}

$('#cityGroups').addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action]');
  if(!button)return;
  const {action,id}=button.dataset;
  if(action==='edit')await editRow(id);
  if(action==='delete')await deleteRow(id);
  if(action==='open')await openFile(id);
});

['search','city','status','protocol'].forEach(x=>$('#'+x).addEventListener(x==='search'?'input':'change',render));

document.querySelectorAll('[data-quick-status]').forEach(button=>button.addEventListener('click',()=>{
  const status=button.dataset.quickStatus;
  $('#status').value=status&&$('#status').value===status?'':status;
  render();
}));

$('#export').onclick=()=>{
  const h=['Miasto','Nr lokalu','Rodzaj przeglądu','Data wykonania','Ważny przez (mies.)','Data następnego przeglądu','Status','Data dodania protokołu','Uwagi'];
  const csv=[h,...data.map(r=>[r.city,r.local,r.type,r.done,r.months,nextDate(r.done,r.months),state(r),r.protocolDate,r.notes])].map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));
  a.download='przeglady-export.csv';
  a.click();
  URL.revokeObjectURL(a.href);
};

start();
</script>
</body>
</html>
